name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Toda segunda-feira: detecta vulnerabilidades novas em dependências que não mudaram.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Menor privilégio: o token do workflow só lê o repositório.
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (lint, formatação e tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      # ESLint com regras de tipo (typescript-eslint) e de code smells (sonarjs).
      # --max-warnings 0: qualquer aviso também reprova.
      - name: Lint e análise estática
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      # Falha se algum teste quebrar ou se a cobertura ficar abaixo dos limites do vitest.config.ts.
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Resumo da cobertura
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-testes
          path: |
            coverage/
            reports/junit.xml
          retention-days: 14

  dependencias:
    name: Segurança – dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      # SCA: compara as versões instaladas com o banco de vulnerabilidades do GitHub Advisory.
      # Reprova vulnerabilidades altas e críticas; moderadas/baixas aparecem no log e no Dependabot.
      - name: Vulnerabilidades conhecidas
        run: npm audit --audit-level=high

      # Cadeia de suprimentos: confere as assinaturas do registry e as atestações de
      # proveniência, garantindo que os pacotes não foram adulterados após a publicação.
      - name: Assinaturas e proveniência dos pacotes
        run: npm audit signatures

  segredos:
    name: Segurança – secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: um segredo apagado num commit posterior continua vazado.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  sast:
    name: Segurança – SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Necessária para enviar os resultados à aba Security > Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions: o CodeQL também analisa os próprios workflows (injeção de comandos, permissões etc.).
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}

  revisao-dependencias:
    name: Segurança – revisão de dependências do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bloqueia o PR que adiciona dependência vulnerável (moderada ou pior) ou com licença não permitida.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, MPL-2.0

  build:
    name: Build
    needs: [qualidade, testes, dependencias, segredos, sast, revisao-dependencias]
    # revisao-dependencias só roda em PR; em push ela fica "skipped" e não deve bloquear o build.
    # Qualquer falha nos jobs anteriores continua impedindo o build.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Publicar artefato de build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14
