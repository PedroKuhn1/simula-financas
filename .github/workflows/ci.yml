name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Toda segunda-feira: detecta vulnerabilidades novas em dependências que não mudaram.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Menor privilégio: o token do workflow só lê o repositório.
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior, que ficou obsoleta.
# Na main nada é cancelado, para não interromper um deploy em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: Qualidade (lint, formatação e tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      # ESLint com regras de tipo (typescript-eslint) e de code smells (sonarjs).
      # --max-warnings 0: qualquer aviso também reprova.
      - name: Lint e análise estática
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      # Falha se algum teste quebrar ou se a cobertura ficar abaixo dos limites do vitest.config.ts.
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Resumo da cobertura
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-testes
          path: |
            coverage/
            reports/junit.xml
          retention-days: 14

  dependencias:
    name: Segurança – dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      # SCA: compara as versões instaladas com o banco de vulnerabilidades do GitHub Advisory.
      # Reprova vulnerabilidades altas e críticas; moderadas/baixas aparecem no log e no Dependabot.
      - name: Vulnerabilidades conhecidas
        run: npm audit --audit-level=high

      # Cadeia de suprimentos: confere as assinaturas do registry e as atestações de
      # proveniência, garantindo que os pacotes não foram adulterados após a publicação.
      # Depende do registry do npm para baixar chaves e atestações; falhas de rede momentâneas
      # geram falso positivo (EMISSINGSIGNATUREKEY). Até 3 tentativas: um pacote realmente
      # adulterado falha em todas e continua reprovando o pipeline.
      - name: Assinaturas e proveniência dos pacotes
        run: |
          for attempt in 1 2 3; do
            npm audit signatures && exit 0
            echo "::warning::Verificação de assinaturas falhou (tentativa $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1

  segredos:
    name: Segurança – secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: um segredo apagado num commit posterior continua vazado.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  sast:
    name: Segurança – SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Necessária para enviar os resultados à aba Security > Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions: o CodeQL também analisa os próprios workflows (injeção de comandos, permissões etc.).
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}

  revisao-dependencias:
    name: Segurança – revisão de dependências do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bloqueia o PR que adiciona dependência vulnerável (moderada ou pior) ou com licença não permitida.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, MPL-2.0

  build:
    name: Build
    needs: [qualidade, testes, dependencias, segredos, sast, revisao-dependencias]
    # revisao-dependencias só roda em PR; em push ela fica "skipped" e não deve bloquear o build.
    # Qualquer falha nos jobs anteriores continua impedindo o build.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      # O site fica em https://<usuário>.github.io/<repositório>/, por isso o caminho base.
      - name: Build de produção
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Conteúdo do artefato
        run: |
          {
            echo '### Artefato de build'
            echo '```'
            find dist -type f -printf '%8s  %p\n' | sort -k2
            echo '```'
            echo '```json'
            cat dist/version.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefato de build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14

      # Empacota o MESMO dist/ no formato exigido pelo GitHub Pages: o que foi testado é o que vai ao ar.
      - name: Preparar artefato do GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy (GitHub Pages)
    needs: build
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    # Só publica a partir da main; PRs param no build.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Um deploy por vez; um deploy em andamento nunca é cancelado.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      # Publicar no Pages e autenticar via OIDC: nenhum token ou senha é armazenado.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-test:
    name: Verificação pós-deploy
    needs: deploy
    # Sem este if, o job herdaria o "skipped" de revisao-dependencias (que só roda em PR)
    # e nunca rodaria após um deploy feito por push na main.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Confirma que o site responde, que o bundle carrega e que a versão no ar é a deste commit.
      - name: Smoke test da aplicação publicada
        # A URL passa por variável de ambiente, nunca interpolada direto no script (evita injeção).
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: scripts/smoke-test.sh "$PAGE_URL" "$GITHUB_SHA"

  docker:
    name: Docker (build, teste, varredura e publicação)
    needs: [qualidade, testes, dependencias, segredos, sast, revisao-dependencias]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Publicar a imagem no GitHub Container Registry (só na main).
      packages: write
      # Enviar o resultado da varredura à aba Security > Code scanning.
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: sha-<commit> sempre; latest só na main.
      - name: Definir tags da imagem
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: simula-financas:ci
          build-args: GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O container precisa funcionar de verdade: mesmo smoke test do deploy, com o
      # sistema de arquivos somente leitura e o commit conferido no version.json.
      - name: Testar o container
        run: |
          docker run -d --name app -p 8080:8080 --read-only --tmpfs /tmp simula-financas:ci
          RETRIES=5 DELAY=2 scripts/smoke-test.sh http://localhost:8080/ "$GITHUB_SHA"
          test "$(docker exec app id -u)" = 101 || { echo '::error::O container deveria rodar como não-root (UID 101)'; exit 1; }
          curl -sI http://localhost:8080/ | grep -qi '^content-security-policy:' || { echo '::error::Cabeçalho CSP ausente'; exit 1; }

      - name: Logs do container
        if: always()
        run: docker logs app || true

      # Varredura de vulnerabilidades da imagem (pacotes do sistema e da aplicação).
      # Reprova vulnerabilidades altas ou críticas que já tenham correção disponível.
      - name: Varredura de vulnerabilidades (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: simula-financas:ci
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Enviar resultado da varredura ao GitHub
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token temporário do próprio workflow: nenhuma senha armazenada.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reaproveita o cache do build acima; inclui SBOM e atestação de proveniência.
      - name: Publicar imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
