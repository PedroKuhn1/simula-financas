name: Release

# Disparado ao criar uma tag de versão (SemVer), por exemplo: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Criar a release e anexar arquivos.
      contents: write
      # Gerar a atestação de proveniência (assinatura via OIDC + Sigstore).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # A tag precisa bater com a versão do package.json, senão a release é recusada.
      - name: Conferir versão da tag
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão do package.json ($expected)."
            exit 1
          fi

      - name: Instalar dependências (lockfile)
        run: npm ci

      # Mesmos portões do CI: nenhuma release sai sem lint, tipos, testes e auditoria passando.
      - name: Validações
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm audit --audit-level=high

      # Build na raiz (/) para quem for hospedar o pacote em outro servidor.
      - name: Build
        run: npm run build

      - name: Empacotar artefato
        id: package
        run: |
          file="simula-financas-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -qr "../$file" .)
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Atestação de proveniência (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}

      # Notas geradas automaticamente a partir dos PRs mesclados desde a última tag.
      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.package.outputs.file }}
        run: gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
