server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Não expõe a versão do nginx nos cabeçalhos e páginas de erro.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeçalhos de segurança (CSP só permite recursos da própria origem).
  include /etc/nginx/snippets/security-headers.conf;

  # Arquivos com hash no nome nunca mudam: cache de 1 ano.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html e version.json sempre revalidados, para uma nova versão aparecer na hora.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /version.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Roteamento da SPA: qualquer outro caminho devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
